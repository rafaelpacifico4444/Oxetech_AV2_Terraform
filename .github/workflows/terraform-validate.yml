name: Terraform Validate & Plan

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-validate.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'terraform/**'

env:
  AWS_REGION: sa-east-1
  TF_VERSION: 1.15.8

jobs:
  format:
    name: Check Terraform Format
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/
        continue-on-error: true

  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform Validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

  lint:
    name: TFLint
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
      
      - name: Init TFLint
        run: |
          cd terraform
          tflint --init
      
      - name: Run TFLint
        run: |
          cd terraform
          tflint
        continue-on-error: true

  plan:
    name: Terraform Plan
    needs: [validate, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform Init
        run: |
          cd terraform
          terraform init
      
      - name: Terraform Plan
        id: plan
        run: |
          cd terraform
          terraform plan -no-color -out=tfplan
        env:
          TF_VAR_owner: github-actions
          TF_VAR_project_name: lab-iac
          TF_VAR_environment: dev
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_flask_secret_key: ${{ secrets.TF_VAR_FLASK_SECRET_KEY }}
          TF_VAR_github_webhook_secret: ${{ secrets.TF_VAR_GITHUB_WEBHOOK_SECRET }}
          TF_VAR_bucket_name: bucket-s3-av2-tf
          TF_VAR_domain_name: olhanuvem.dev
      
      - name: Convert Plan to JSON
        if: always()
        run: |
          cd terraform
          terraform show -json tfplan > tfplan.json || true
      
      - name: Comment Plan on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planPath = 'terraform/tfplan.json';
            
            let planOutput = '```\nPlano gerado com sucesso\n```';
            
            if (fs.existsSync(planPath)) {
              try {
                const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'));
                const changes = plan.resource_changes || [];
                const summary = `
            **Terraform Plan Summary:**
            - Resources to add: ${changes.filter(c => c.change.actions.includes('create')).length}
            - Resources to modify: ${changes.filter(c => c.change.actions.includes('update')).length}
            - Resources to destroy: ${changes.filter(c => c.change.actions.includes('delete')).length}
                `;
                planOutput = summary;
              } catch (e) {
                planOutput = '```\nErro ao parsear plan\n```';
              }
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: planOutput
            });
      
      - name: Upload Plan Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: terraform/tfplan*
          retention-days: 7
      
      - name: Set Plan Status
        run: |
          if [ -s terraform/tfplan ]; then
            echo "Plan contains changes"
          else
            echo "No changes detected"
          fi
